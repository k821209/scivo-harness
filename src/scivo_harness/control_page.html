<!--
  scivo-control — the web half of `/scivo-control`.

  Published with publish_page and handed a scoped `window.scivo` client. It
  reads `content/head` and `content/log-<sid>-<k>`, and writes three fixed docs
  under `responses`: inbox, approvals, control. See control.py for why the
  layout is shaped like this.

  Security, because this page runs in the dashboard's origin and anything it
  writes to `responses` is acted on by an agent with a shell on the owner's
  machine: model output is never trusted as markup. Markdown is rendered by
  marked and sanitized by DOMPurify with style and form elements removed, and
  HTML is shown only inside a sandbox="" iframe — no scripts, no same-origin.
  The preview iframes are created by this code after sanitizing, never by the
  markdown, so the sandbox attribute is ours and cannot be edited away.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>

<style>
  #sc-root {
    --bg: #fbfaf7; --panel: #ffffff; --ink: #1c1b19; --muted: #6b6860; --line: #e6e2d9;
    --accent: #2f6f5e; --accent-ink: #ffffff; --user: #eef4f1; --warn: #9a6200; --err: #b3261e;
    --code: #0f1419; --shadow: 0 1px 2px rgba(0,0,0,.06);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
    color: var(--ink); background: var(--bg);
    display: flex; flex-direction: column; height: 100dvh; max-width: 980px; margin: 0 auto;
  }
  @media (prefers-color-scheme: dark) {
    #sc-root { --bg: #141412; --panel: #1c1c1a; --ink: #ecebe6; --muted: #9c998f; --line: #2d2c28;
      --accent: #5fb39a; --accent-ink: #0d1a16; --user: #1f2a26; --warn: #e0a84a; --err: #ff8a80; }
  }
  #sc-root * { box-sizing: border-box; }
  .sc-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .sc-title { font-weight: 650; }
  .sc-sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sc-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .sc-dot.live { background: #3fb67b; box-shadow: 0 0 0 3px rgba(63,182,123,.18); }
  .sc-dot.stale { background: var(--warn); }
  .sc-dot.ended { background: var(--err); }
  .sc-spacer { flex: 1; }
  .sc-log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .sc-empty { color: var(--muted); text-align: center; margin: auto; max-width: 420px; }
  .sc-user { align-self: flex-end; max-width: 85%; background: var(--user); border: 1px solid var(--line);
    padding: 8px 12px; border-radius: 12px 12px 2px 12px; white-space: pre-wrap; word-break: break-word; }
  .sc-via { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .sc-thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .sc-thumbs img { max-height: 120px; max-width: 100%; border-radius: 6px; border: 1px solid var(--line); }
  .sc-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 6px; }
  .sc-chips:empty { display: none; }
  .sc-chip { position: relative; }
  .sc-chip img { height: 48px; border-radius: 6px; border: 1px solid var(--line); display: block; }
  .sc-chip button { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 11px; line-height: 1; cursor: pointer; }
  .sc-pending { opacity: .6; }
  .sc-assistant { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 4px 14px; box-shadow: var(--shadow); overflow-wrap: anywhere; }
  .sc-assistant.streaming::after { content: "▍"; color: var(--accent); animation: sc-blink 1s steps(2) infinite; }
  @keyframes sc-blink { 50% { opacity: 0; } }
  .sc-md table { border-collapse: collapse; display: block; overflow-x: auto; margin: 10px 0; }
  .sc-md th, .sc-md td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
  .sc-md pre { background: var(--code); color: #e6e1cf; padding: 10px 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; }
  .sc-md code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .92em; }
  .sc-md :not(pre) > code { background: rgba(127,127,127,.15); padding: 1px 5px; border-radius: 4px; }
  .sc-md blockquote { border-left: 3px solid var(--line); margin: 8px 0; padding: 2px 12px; color: var(--muted); }
  .sc-md img { max-width: 100%; }
  .sc-md a { color: var(--accent); }
  /* The dashboard renders a published page INTO its own document, and its
     Tailwind preflight zeroes exactly the defaults markdown leans on:
     `ol, ul { list-style: none; margin: 0; padding: 0 }`, `margin: 0` on
     p / headings / hr, and headings down to `font-size: inherit;
     font-weight: inherit`. A two-item ordered list arrived as two unnumbered
     lines, so the "1번 / 2번" in the next paragraph pointed at nothing
     (feedback 552ccf991ba9). Restored for the markdown subtree only: the page
     must not depend on being opened standalone, where the browser defaults
     would have covered this. */
  .sc-md p { margin: 8px 0; }
  .sc-md ul, .sc-md ol { margin: 8px 0; padding-left: 1.7em; }
  .sc-md ul { list-style: disc outside; }
  .sc-md ol { list-style: decimal outside; }
  .sc-md li { margin: 3px 0; }
  .sc-md li > p { margin: 0; }
  .sc-md li > ul, .sc-md li > ol { margin: 3px 0; }
  .sc-md h1, .sc-md h2, .sc-md h3, .sc-md h4, .sc-md h5, .sc-md h6 {
    font-weight: 650; line-height: 1.3; margin: 14px 0 6px; }
  .sc-md h1 { font-size: 1.3em; }
  .sc-md h2 { font-size: 1.17em; }
  .sc-md h3 { font-size: 1.05em; }
  .sc-md hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
  .sc-md > :first-child { margin-top: 0; }
  .sc-md > :last-child { margin-bottom: 0; }
  .sc-preview { width: 100%; min-height: 160px; height: 280px; border: 1px solid var(--line); border-radius: 8px; background: #fff; margin: 4px 0 10px; resize: vertical; }
  .sc-preview-label { font-size: 12px; color: var(--muted); }
  .sc-tool { font: 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); padding: 0 4px; white-space: pre-wrap; word-break: break-all; }
  .sc-tool b { color: var(--ink); font-weight: 600; }
  .sc-status { font-size: 13px; color: var(--muted); text-align: center; }
  .sc-status.warn { color: var(--warn); } .sc-status.error { color: var(--err); }
  .sc-result { font-size: 12px; color: var(--muted); text-align: right; }
  .sc-approval { border: 1px solid var(--warn); border-radius: 10px; padding: 10px 12px; background: var(--panel); }
  .sc-approval .sc-q { font-weight: 600; margin-bottom: 4px; }
  .sc-approval .sc-detail { font: 12.5px ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all; color: var(--muted); }
  .sc-approval .sc-note { font-size: 12px; color: var(--warn); margin-top: 4px; }
  .sc-btns { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .sc-btn { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    padding: 6px 14px; border-radius: 8px; cursor: pointer; }
  .sc-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .sc-btn.danger { color: var(--err); }
  .sc-btn:disabled { opacity: .5; cursor: default; }
  .sc-decided { font-size: 13px; margin-top: 6px; font-weight: 600; }
  /* The option that was picked stays visibly picked while the rest of the
     card is still being answered and until the harness reflects the answer:
     with every button greyed the same, the pick was invisible (2026-10-02). */
  .sc-btn.chosen { background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); opacity: 1 !important; }
  .sc-question.answered .sc-btn:not(.chosen) { opacity: .35; }
  .sc-foot { border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); position: relative; }
  .sc-row { display: flex; gap: 8px; align-items: flex-end; }
  .sc-input { flex: 1; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 12px; resize: none; max-height: 40vh; min-height: 42px; }
  .sc-input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .sc-menu { position: absolute; left: 12px; right: 12px; bottom: 100%; max-height: 260px; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.15); }
  .sc-menu div { padding: 6px 12px; cursor: pointer; display: flex; gap: 10px; }
  .sc-menu div.on, .sc-menu div:hover { background: var(--user); }
  .sc-menu b { font-family: ui-monospace, Menlo, monospace; font-weight: 600; white-space: nowrap; }
  .sc-menu span { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sc-hint { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
</style>

<div id="sc-root">
  <div class="sc-head">
    <span class="sc-dot" id="sc-dot"></span>
    <div style="min-width:0">
      <div class="sc-title" id="sc-title">scivo-control</div>
      <div class="sc-sub" id="sc-sub">waiting for the local session…</div>
    </div>
    <span class="sc-spacer"></span>
    <button class="sc-btn danger" id="sc-stop" title="Interrupt the running turn">Stop</button>
  </div>
  <div class="sc-log" id="sc-log"><div class="sc-empty" id="sc-empty">No session is connected. Run <code>/scivo-control</code> inside <code>scivo</code> on your machine; this page picks it up by itself.</div></div>
  <div class="sc-foot">
    <div class="sc-menu" id="sc-menu" hidden></div>
    <div class="sc-row">
      <textarea class="sc-input" id="sc-input" rows="1" placeholder="Message your session — / for commands · paste or drop an image"></textarea>
      <button class="sc-btn primary" id="sc-send">Send</button>
    </div>
    <div class="sc-hint">Enter to send · Shift+Enter for a new line · runs on your machine, with its tools</div>
  </div>
</div>

<script>
(function () {
  const C = window.scivo;
  const $ = (id) => document.getElementById(id);
  const log = $("sc-log"), input = $("sc-input"), menu = $("sc-menu");
  const HEAD_EVERY = 800, STALE_MS = 20000;

  const S = { sid: null, head: null, events: [], nodes: new Map(), json: new Map(),
              seq: 0, msgs: [], interrupt: 0, commands: [], menuIndex: 0 };

  // ------------------------------------------------------------ rendering
  marked.setOptions({ gfm: true, breaks: true });
  const renderer = new marked.Renderer();
  renderer.code = function (code, lang) {
    const language = (lang || "").trim().split(/\s+/)[0];
    let body;
    try {
      body = language && window.hljs && hljs.getLanguage(language)
        ? hljs.highlight(code, { language }).value
        : (window.hljs ? hljs.highlightAuto(code).value : escapeHtml(code));
    } catch (_) { body = escapeHtml(code); }
    return `<pre><code class="hljs language-${escapeHtml(language)}" data-raw="${encodeURIComponent(code)}">${body}</code></pre>`;
  };
  marked.use({ renderer });
  // Strikethrough only for ~~double~~ tildes. marked also strikes ~single~
  // pairs, and in research text a lone ~ means "approximately": "~91 GB …
  // ~1.3 TB" came out struck through in the first rendered briefing.
  marked.use({ tokenizer: {
    del(src) {
      const double = /^~~(?=\S)([\s\S]*?\S)~~(?!~)/.exec(src);
      if (double) return { type: "del", raw: double[0], text: double[1], tokens: this.lexer.inlineTokens(double[1]) };
      if (src[0] === "~") return { type: "text", raw: "~", text: "~" };
      return false;
    },
  } });

  DOMPurify.addHook("afterSanitizeAttributes", (node) => {
    if (node.tagName === "A") { node.setAttribute("target", "_blank"); node.setAttribute("rel", "noopener noreferrer"); }
  });
  const PURIFY = { FORBID_TAGS: ["style", "form", "input", "button", "textarea", "select", "iframe", "object", "embed"],
                   FORBID_ATTR: ["style"], ADD_ATTR: ["target", "data-raw"] };

  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  function renderMarkdown(target, text) {
    target.innerHTML = DOMPurify.sanitize(marked.parse(text || ""), PURIFY);
    // HTML blocks get a live preview in a sandbox with no scripts and no origin.
    target.querySelectorAll("code.language-html, code.language-svg").forEach((code) => {
      const raw = decodeURIComponent(code.getAttribute("data-raw") || "");
      if (!raw.trim()) return;
      const label = document.createElement("div");
      label.className = "sc-preview-label"; label.textContent = "rendered (sandboxed, scripts off)";
      const frame = document.createElement("iframe");
      frame.className = "sc-preview"; frame.setAttribute("sandbox", ""); frame.setAttribute("referrerpolicy", "no-referrer");
      frame.srcdoc = raw;
      const pre = code.closest("pre");
      pre.after(label); label.after(frame);
    });
  }

  function atBottom() { return log.scrollHeight - log.scrollTop - log.clientHeight < 80; }

  function nodeFor(ev) {
    const el = document.createElement("div");
    switch (ev.kind) {
      case "user": {
        el.className = "sc-user";
        const via = document.createElement("span"); via.className = "sc-via"; via.textContent = ev.via === "web" ? "you · web" : "you · terminal";
        el.append(via, document.createTextNode(ev.text || ""));
        if (Array.isArray(ev.images) && ev.images.length) el.append(thumbs(ev.images));
        break;
      }
      case "assistant":
        el.className = "sc-assistant sc-md" + (ev.done ? "" : " streaming");
        renderMarkdown(el, ev.text);
        break;
      case "tool":
        el.className = "sc-tool";
        el.innerHTML = "· <b>" + escapeHtml(ev.name) + "</b>" + (ev.detail ? "  " + escapeHtml(ev.detail) : "");
        break;
      case "result": {
        el.className = "sc-result";
        el.textContent = (ev.error ? "⚠ " + ev.error + " · " : "") + `${ev.turns} turns · $${Number(ev.cost).toFixed(3)} · $${Number(ev.total).toFixed(3)} session`;
        break;
      }
      case "approval": approvalNode(el, ev); break;
      case "question": questionNode(el, ev); break;
      default:
        el.className = "sc-status " + (ev.level || "");
        el.textContent = ev.text || "";
    }
    return el;
  }

  function approvalNode(el, ev) {
    el.className = "sc-approval";
    const q = document.createElement("div"); q.className = "sc-q"; q.textContent = "Allow " + ev.tool + "?";
    const d = document.createElement("div"); d.className = "sc-detail"; d.textContent = ev.detail || "";
    el.append(q, d);
    if (ev.outward) { const n = document.createElement("div"); n.className = "sc-note"; n.textContent = "Reaches outside your machine — approved one call at a time."; el.append(n); }
    if (ev.state === "pending") {
      const row = document.createElement("div"); row.className = "sc-btns";
      const button = (label, decision, cls) => { const b = document.createElement("button"); b.className = "sc-btn " + (cls || ""); b.textContent = label;
        b.onclick = () => { const btns = row.querySelectorAll("button"); btns.forEach((x) => (x.disabled = true));
          decide(ev.rid, decision).catch((e) => { btns.forEach((x) => (x.disabled = false)); alert("Not sent: " + e.message); }); }; return b; };
      row.append(button("Allow", "allow", "primary"));
      if (!ev.outward) row.append(button("Always for this tool", "always"));
      row.append(button("Deny", "deny", "danger"));
      el.append(row);
    } else {
      const s = document.createElement("div"); s.className = "sc-decided";
      s.textContent = { allow: "✓ allowed", always: "✓ allowed for the rest of the session", deny: "✗ denied" }[ev.state] || ev.state;
      el.append(s);
    }
  }

  function questionNode(el, ev) {
    el.className = "sc-approval";
    const head = document.createElement("div"); head.className = "sc-q";
    head.textContent = ev.state === "pending" ? "❔ The model is asking:" : "❔ Asked earlier";
    el.append(head);
    (ev.questions || []).forEach((q, qi) => {
      const box = document.createElement("div"); box.className = "sc-question";
      const label = document.createElement("div"); label.className = "sc-detail";
      label.textContent = (q.header ? "[" + q.header + "] " : "") + q.question;
      box.append(label);
      if (ev.state === "pending") {
        const row = document.createElement("div"); row.className = "sc-btns";
        (q.options || []).forEach((o) => {
          const b = document.createElement("button"); b.className = "sc-btn primary";
          b.textContent = o.label + (o.description ? "  — " + o.description : "");
          b.style.whiteSpace = "normal"; b.style.textAlign = "left";
          b.onclick = () => { markChosen(box, b, o.label); submitQuestionAnswer(ev, qi, o.label, box); };
          row.append(b);
        });
        const input = document.createElement("input"); input.type = "text";
        input.className = "sc-question-text"; input.placeholder = "or type your own answer, then Enter";
        input.style.marginTop = "6px"; input.style.width = "100%";
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && input.value.trim()) { e.preventDefault(); markChosen(box, null, input.value.trim()); submitQuestionAnswer(ev, qi, input.value.trim(), box); }
        });
        const skip = document.createElement("button"); skip.className = "sc-btn danger";
        skip.textContent = "skip this question";
        skip.onclick = () => { markChosen(box, skip, "skipped"); submitQuestionAnswer(ev, qi, null, box); };
        box.append(row, input, skip);
      } else if (ev.answers && ev.answers[q.question] !== undefined) {
        const s2 = document.createElement("div"); s2.className = "sc-decided";
        s2.textContent = "✓ " + (Array.isArray(ev.answers[q.question]) ? ev.answers[q.question].join(", ") : String(ev.answers[q.question]));
        box.append(s2);
      }
      el.append(box);
    });
  }

  // The page keeps a per-question answer draft in memory; when every question
  // has an answer (or was skipped), the whole set is submitted so the harness
  // can hand the model one answers object.
  // rid -> { [question_INDEX]: label_or_text_or_null }. Keyed by index, not by
  // the question text: the draft is written to Firestore as a map, so its keys
  // become part of a property path, and a path may not exceed 1500 bytes. A
  // long question (22 finished background tasks, in one case) made every click
  // fail with "Not sent: property path is longer than 1500 bytes" — the card
  // rolled back correctly, so the button simply looked dead. The harness maps
  // indices back to question text, which it already has.
  const questionDrafts = new Map();
  function markChosen(box, button, label) {
    box.classList.add("answered");
    box.querySelectorAll("button, input").forEach((el) => { el.disabled = true; });
    if (button) { button.classList.add("chosen"); button.textContent = "✓ " + button.textContent.replace(/^✓ /, ""); }
    const line = document.createElement("div"); line.className = "sc-decided";
    line.textContent = "✓ " + label + (button ? "" : " (your own words)");
    box.append(line);
  }
  function submitQuestionAnswer(ev, qi, value, box) {
    const q = ev.questions[qi];
    if (!questionDrafts.has(ev.rid)) questionDrafts.set(ev.rid, {});
    const draft = questionDrafts.get(ev.rid);
    draft[String(qi)] = value;
    // Only this card's rows: querying the whole log picked rows of an
    // earlier question card when two were on the page.
    const rows = box ? [box] : [];
    // When every question is answered or skipped, push.
    if (ev.questions.every((_qq, i) => draft[String(i)] !== undefined)) {
      const answers = {};
      for (const [k, v] of Object.entries(draft)) if (v !== null) answers[k] = v;
      C.put("responses", "questions", { doc: "questions", sid: S.sid,
        answers: { [ev.rid]: Object.keys(answers).length ? answers : null } })
        .catch((e) => {
          // Same as a failed approval: the row must come back, or the harness
          // waits on an answer nobody can give.
          rows.forEach((r) => { r.classList.remove("answered"); r.querySelectorAll("button, input").forEach((el) => { el.disabled = false; el.classList.remove("chosen"); }); r.querySelectorAll(".sc-decided").forEach((d) => d.remove()); });
          questionDrafts.set(ev.rid, draft);
          alert("Not sent: " + e.message);
        });
      questionDrafts.delete(ev.rid);
    }
  }

  function render(events) {
    const stick = atBottom();
    if (events.length) $("sc-empty")?.remove();
    for (const ev of events) {
      const key = ev.i, json = JSON.stringify(ev);
      if (S.json.get(key) === json) continue;
      if (ev.kind === "user" && ev.via === "web" && !S.nodes.has(key)) {
        const echo = [...log.querySelectorAll(".sc-pending")].find((n) => n.dataset.text === (ev.text || ""));
        if (echo) echo.remove();
      }
      const fresh = nodeFor(ev), old = S.nodes.get(key);
      if (old) old.replaceWith(fresh);
      else {
        // In event order: an earlier chunk loaded on request lands above
        // what is already drawn, not under it.
        let next = null;
        for (const [k, n] of S.nodes) if (k > key && (!next || k < next[0])) next = [k, n];
        if (next) log.insertBefore(fresh, next[1]); else log.append(fresh);
      }
      S.nodes.set(key, fresh); S.json.set(key, json);
    }
    if (stick) log.scrollTop = log.scrollHeight;
  }

  // --------------------------------------------------------------- syncing
  // Live when the client can subscribe: a write on the harness side reaches the
  // callback here in 54–94 ms (measured). Older dashboards without subscribe
  // fall back to polling the head.
  const LIVE = typeof C.subscribeDoc === "function";
  const chunkSubs = new Map();   // k -> unsubscribe
  let queue = Promise.resolve();

  async function resetFor(head) {
    for (const un of chunkSubs.values()) { try { un(); } catch (_) {} }
    chunkSubs.clear();
    S.sid = head.sid; S.events = []; S.nodes.clear(); S.json.clear(); S.oldest = undefined;
    log.innerHTML = ""; log.prepend(earlier); earlier.hidden = true;
    S.seq = 0; S.msgs = []; S.interrupt = 0;
    S.marked = 0; markPresent();      // a new session has not heard from this tab yet
    try {  // resume the interrupt counter if this tab reloads mid-session
      for (const r of await C.list("responses")) {
        if (r.sid !== head.sid) continue;
        if (r.doc === "control") S.interrupt = r.interrupt || 0;
      }
    } catch (_) {}
    // The command list is written after the first head, so a single read
    // here usually lost the race and the slash menu stayed empty all session.
    // Subscribe where the client can (dashboard ≥ 2026-09-17); else read once.
    S.commands = [];
    try {
      if (typeof C.subscribeDoc === "function") {
        if (S.unsubCommands) { try { S.unsubCommands(); } catch (_) {} }
        S.unsubCommands = C.subscribeDoc("content", "commands-" + head.sid, (c) => { S.commands = (c && c.list) || []; });
      } else {
        const c = await C.get("content", "commands-" + head.sid); S.commands = (c && c.list) || [];
      }
    } catch (_) { S.commands = []; }
  }

  function chunkId(sid, k) { return `log-${sid}-${String(k).padStart(4, "0")}`; }

  function mergeChunk(doc, draw = true) {
    for (const ev of (doc && doc.events) || []) S.events[ev.i] = ev;
    if (draw) render(S.events.filter(Boolean));
  }

  // Only the newest chunks are read on open. A long session (785 events,
  // 42 chunks) was fetched and rendered in full — forty listeners and
  // hundreds of markdown renders before the first message showed, on a
  // phone (2026-10-04). Settled chunks never change, so the earlier ones
  // are fetched once, on request, in batches.
  const RECENT_CHUNKS = 2, EARLIER_BATCH = 5;
  const earlier = document.createElement("button");
  earlier.type = "button"; earlier.className = "sc-btn"; earlier.id = "sc-earlier"; earlier.hidden = true;
  earlier.style.alignSelf = "center"; earlier.style.fontSize = "12px";
  earlier.textContent = "earlier messages";
  log.prepend(earlier);
  async function loadEarlier() {
    if (!S.sid || !(S.oldest > 0)) return;
    earlier.disabled = true; earlier.textContent = "loading…";
    const from = Math.max(0, S.oldest - EARLIER_BATCH);
    const before = log.scrollHeight;
    try {
      const docs = await Promise.all(Array.from({ length: S.oldest - from }, (_, j) => C.get("content", chunkId(S.sid, from + j))));
      docs.forEach((d) => mergeChunk(d, false));
      render(S.events.filter(Boolean));
      S.oldest = from;
      log.scrollTop += log.scrollHeight - before;     // keep the eye where it was
    } catch (e) { setDot("stale", e.message); }
    earlier.disabled = false; earlier.textContent = "earlier messages";
    earlier.hidden = S.oldest === 0;
  }
  earlier.onclick = loadEarlier;

  function listenChunk(sid, k) {
    if (chunkSubs.has(k)) return;
    const unsubscribe = C.subscribeDoc("content", chunkId(sid, k), (doc) => {
      if (S.sid !== sid || !doc) return;
      mergeChunk(doc);
      // Listen one chunk ahead before it exists, so the first event of the
      // next chunk arrives with no round trip through the head.
      listenChunk(sid, k + 1);
      const size = (S.head && S.head.chunk) || 20, events = doc.events || [];
      const settled = events.length >= size && events.every((e) =>
        !(e.kind === "assistant" && !e.done) && !(e.kind === "approval" && e.state === "pending")
        && !(e.kind === "question" && e.state === "pending"));
      if (settled && chunkSubs.has(k + 2)) { unsubscribe(); chunkSubs.delete(k); }
    });
    chunkSubs.set(k, unsubscribe);
  }

  async function applyHead(head) {
    S.lastHead = head;
    if (!head) { setDot("", "waiting for the local session…"); return; }
    if (head.sid !== S.sid) await resetFor(head);
    $("sc-title").textContent = head.project || "scivo-control";
    refreshDot();
    const chunk = head.chunk || 20, total = head.events || 0;
    const to = Math.floor(Math.max(0, total - 1) / chunk);
    if (LIVE) {
      S.head = head;
      const start = Math.max(0, to - RECENT_CHUNKS + 1);
      if (S.oldest === undefined || S.oldest > start) S.oldest = start;
      for (let k = Math.min(S.oldest, start); k <= to + 1; k++) listenChunk(head.sid, k);
      earlier.hidden = !(S.oldest > 0);
      return;
    }
    if (S.head && S.head.rev === head.rev && S.head.sid === head.sid) return;
    const prevCount = S.head && S.head.sid === head.sid ? S.head.events : 0;
    S.head = head;
    let from = Math.floor(Math.max(0, prevCount - 1) / chunk);
    S.events.forEach((ev) => { if ((ev.kind === "assistant" && !ev.done) || (ev.kind === "approval" && ev.state === "pending") || (ev.kind === "question" && ev.state === "pending")) from = Math.min(from, Math.floor(ev.i / chunk)); });
    for (let k = from; k <= to && total > 0; k++) mergeChunk(await C.get("content", chunkId(head.sid, k)));
  }

  function refreshDot() {
    const head = S.lastHead;
    if (!head) return;
    // Age of the LAST CHANGE of the beat, on this clock. Comparing the
    // harness's wall clock with the browser's read a client that runs behind
    // as "live" forever after the harness died.
    S.beatSeen = S.beatSeen || { beat: null, at: 0 };
    if (S.beatSeen.beat !== head.beat) S.beatSeen = { beat: head.beat, at: Date.now() };
    const age = Date.now() - S.beatSeen.at;
    const state = head.state === "ended" ? "ended" : age > STALE_MS ? "stale" : "live";
    setDot(state, { live: "connected", stale: "no heartbeat for " + Math.round(age / 1000) + "s", ended: "session ended — run /scivo-control again" }[state]
      + " · " + (head.model || "") + " · " + head.sid + (LIVE ? "" : " · polling"));
  }

  function setDot(state, text) { $("sc-dot").className = "sc-dot " + state; $("sc-sub").textContent = text; }

  function onHead(head) { queue = queue.then(() => applyHead(head)).catch((e) => setDot("stale", e.message)); }

  let headSub = null;

  function listenHead() {
    if (!LIVE) return;
    try { headSub && headSub(); } catch (_) {}
    headSub = C.subscribeDoc("content", "head", onHead);
  }

  // A phone suspends the page the moment you switch away, and the live
  // subscription does not always survive it: coming back showed "no heartbeat
  // for 94s" on a session that was running fine. So on the way back, fetch the
  // head once and start the subscriptions again from scratch.
  async function resume() {
    if (document.visibilityState !== "visible") return;
    setDot("stale", "reconnecting…");
    for (const un of chunkSubs.values()) { try { un(); } catch (_) {} }
    chunkSubs.clear();
    listenHead();
    try { onHead(await C.get("content", "head")); await queue; refreshDot(); }
    catch (e) { setDot("stale", e.message); }
  }

  // ------------------------------------------------------------ presence
  // The session reads its inbox less and less often the longer nothing
  // happens (twice a second for ever was 34 million Firestore reads a day
  // across 22 idle sessions, 2026-11-10), so a message typed after a quiet
  // hour could wait fifteen seconds. Saying "someone is here" when the page
  // is actually being USED lets the session speed up while the person is
  // still reading, so the wait is not spent on their message.
  //
  // Used, not merely open: a mark on every timer tick would hold a session
  // awake for as long as a tab sat in the background of somebody's browser,
  // which is how the old cadence was paid for by nobody looking.
  const VIEWER_EVERY = 30000, VIEWER_FRESH = 120000;
  S.touched = 0; S.marked = 0;
  async function markPresent() {
    if (!S.sid || document.visibilityState !== "visible") return;
    const now = Date.now();
    if (now - S.touched > VIEWER_FRESH || now - S.marked < VIEWER_EVERY) return;
    S.marked = now;
    // Merged into the control document, so `interrupt` beside it is kept.
    try { await C.put("responses", "control", { doc: "control", sid: S.sid, viewer: now }); }
    catch (_) { S.marked = 0; }       // not worth an alert; the next touch tries again
  }
  function touched() { S.touched = Date.now(); markPresent(); }

  function start() {
    for (const kind of ["pointerdown", "keydown"]) document.addEventListener(kind, touched, { passive: true });
    window.addEventListener("focus", touched);
    setInterval(markPresent, VIEWER_EVERY);
    touched();                        // opening the page is a person being here
    setInterval(refreshDot, 2000);  // the heartbeat can go quiet without any write to notice
    document.addEventListener("visibilitychange", resume);
    window.addEventListener("focus", resume);
    window.addEventListener("online", resume);
    if (LIVE) { listenHead(); return; }
    const poll = async () => { try { onHead(await C.get("content", "head")); await queue; } catch (e) { setDot("stale", e.message); } setTimeout(poll, HEAD_EVERY); };
    poll();
  }

  // ----------------------------------------------------------------- images
  // A pasted or dropped image is downscaled here (long side 1400 px, JPEG
  // unless it has transparency) so it fits a Firestore document beside the
  // text, then rides in the message as a data URL. Shown as a chip until sent.
  S.images = [];
  const chips = document.createElement("div"); chips.className = "sc-chips";
  input.parentElement.insertBefore(chips, input.parentElement.firstChild);
  function thumbs(urls) {
    const box = document.createElement("div"); box.className = "sc-thumbs";
    for (const u of urls) { const im = document.createElement("img"); im.src = u; im.alt = "attached image"; box.append(im); }
    return box;
  }
  function renderChips() {
    chips.innerHTML = "";
    S.images.forEach((u, i) => {
      const c = document.createElement("span"); c.className = "sc-chip";
      const im = document.createElement("img"); im.src = u;
      const x = document.createElement("button"); x.type = "button"; x.textContent = "×"; x.title = "remove";
      x.onclick = () => { S.images.splice(i, 1); renderChips(); };
      c.append(im, x); chips.append(c);
    });
  }
  async function shrinkImage(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const scale = Math.min(1, 1400 / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
      const ctx = cv.getContext("2d"); ctx.drawImage(img, 0, 0, cv.width, cv.height);
      const px = ctx.getImageData(0, 0, Math.min(cv.width, 64), Math.min(cv.height, 64)).data;
      const alpha = file.type === "image/png" && px.some((v, k) => k % 4 === 3 && v < 255);
      let out = alpha ? cv.toDataURL("image/png") : cv.toDataURL("image/jpeg", 0.85);
      if (out.length > 700000) out = cv.toDataURL("image/jpeg", 0.6);
      if (out.length > 700000) throw new Error("image too large after downscaling");
      return out;
    } finally { URL.revokeObjectURL(url); }
  }
  async function addImage(file) {
    if (!file || !file.type.startsWith("image/")) return;
    try { S.images.push(await shrinkImage(file)); renderChips(); }
    catch (e) { alert("Could not attach image: " + e.message); }
  }
  input.addEventListener("paste", (e) => {
    const files = [...(e.clipboardData?.files || [])].filter((f) => f.type.startsWith("image/"));
    if (!files.length) return;
    e.preventDefault(); files.forEach(addImage);
  });
  for (const evName of ["dragover", "drop"]) document.addEventListener(evName, (e) => {
    if (!e.dataTransfer?.types?.includes("Files")) return;
    e.preventDefault();
    if (evName === "drop") [...e.dataTransfer.files].forEach(addImage);
  });

  // The dashboard, when this page is embedded in its control dock, hands the
  // input a passage to work on: the Paper tab's "Edit with Claude" on a
  // selection. It COMPOSES rather than sends — the passage alone is not a
  // request, and a message that left on its own would be one nobody wrote.
  // The user adds the instruction and presses Enter, which is also what makes
  // the dock open and visible before anything is spent.
  //
  // Same origin only, and only from the frame that embedded us. The page runs
  // in the dashboard's origin, so a message from anywhere else is not the
  // dashboard; accepting one would let any page that can embed this one type
  // into the session.
  window.addEventListener("message", (e) => {
    if (e.origin !== location.origin) return;
    if (e.source !== window.parent || window.parent === window) return;
    const d = e.data;
    if (!d || d.type !== "scivo-control:compose" || typeof d.text !== "string") return;
    const text = d.text.slice(0, 8000);
    input.value = input.value.trim() ? input.value.replace(/\s*$/, "\n\n") + text : text;
    autosize();
    input.focus();
    try { input.setSelectionRange(input.value.length, input.value.length); } catch (_) {}
    // Acknowledged, because postMessage never fails: a page published before
    // this listener existed ignores the message silently, and the button that
    // sent it would still say it went. The dashboard waits for this and tells
    // the user to restart the session when it does not come (user,
    // 2026-11-09: "ask claude 는 생겼는데, scivo chat으로 안넘어가네" — all 24
    // live pages predated the listener).
    try { e.source.postMessage({ type: "scivo-control:composed" }, e.origin); } catch (_) {}
  });

  // ----------------------------------------------------------------- input
  async function send() {
    const text = input.value.replace(/\s+$/, "");
    const images = S.images.slice();
    if ((!text.trim() && !images.length) || !S.sid) return;
    input.value = ""; autosize(); hideMenu(); S.images = []; renderChips();
    // One document per message, named by a random id. The inbox used to be
    // ONE document holding this tab's numbered list, replaced whole on every
    // send; a second tab (the dock and a phone, or a reload beside the old
    // tab) numbered from its own counter, so the tab that was behind sent
    // numbers the session had already passed — ignored, "sending…" forever —
    // and each write wiped the other tab's messages from the document
    // (msja, 2026-09-28). Now nothing is shared between tabs but the clock.
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    // Shown at once; replaced by the session's own echo when it takes the message.
    const pending = document.createElement("div");
    pending.className = "sc-user sc-pending"; pending.dataset.text = text;
    const via = document.createElement("span"); via.className = "sc-via";
    // An idle session reads its inbox at long intervals, and "sending…" with
    // nothing after it reads as a lost message. Say what it is waiting for.
    const wait = Math.round((S.lastHead && S.lastHead.poll_s) || 0);
    via.textContent = "you · web · sending…" + (wait >= 2 ? " the session was idle — it looks about every " + wait + " s" : "");
    pending.append(via, document.createTextNode(text));
    if (images.length) pending.append(thumbs(images));
    log.append(pending); log.scrollTop = log.scrollHeight;
    const body = { doc: "inbox", sid: S.sid, id, seq: Date.now(), text };
    if (images.length) body.images = images;
    try { await C.put("responses", "inbox-" + id, body); }
    catch (e) { pending.remove(); input.value = text; S.images = images; renderChips(); alert("Not sent: " + e.message); }
  }
  async function decide(rid, decision) {
    await C.put("responses", "approvals", { doc: "approvals", sid: S.sid, decisions: { [rid]: decision } });
  }
  async function stop() {
    if (!S.sid) return;
    S.interrupt += 1;
    try { await C.put("responses", "control", { doc: "control", sid: S.sid, interrupt: S.interrupt }); }
    catch (e) { S.interrupt -= 1; alert("Stop not sent: " + e.message); }
  }

  function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, window.innerHeight * 0.4) + "px"; }

  function matches() {
    const v = input.value;
    if (!v.startsWith("/") || /\s/.test(v)) return [];
    const needle = v.slice(1).toLowerCase();
    const starts = S.commands.filter((c) => c.name.slice(1).toLowerCase().startsWith(needle));
    const contains = S.commands.filter((c) => needle && c.name.toLowerCase().includes(needle) && !starts.includes(c));
    return [...starts, ...contains].slice(0, 40);
  }
  function showMenu() {
    const list = matches();
    if (!list.length) return hideMenu();
    S.menuIndex = Math.min(S.menuIndex, list.length - 1);
    menu.innerHTML = "";
    list.forEach((c, i) => {
      const row = document.createElement("div"); if (i === S.menuIndex) row.className = "on";
      const b = document.createElement("b"); b.textContent = c.name;
      const s = document.createElement("span"); s.textContent = c.help || "";
      // pointerdown, not mousedown: a tap on a phone reaches mousedown late
      // or not at all once the textarea has lost focus.
      row.append(b, s); row.onpointerdown = (e) => { e.preventDefault(); pick(c); };
      menu.append(row);
    });
    menu.hidden = false;
  }
  function hideMenu() { menu.hidden = true; S.menuIndex = 0; }
  function pick(c) { input.value = c.name + " "; hideMenu(); input.focus(); autosize(); }

  input.addEventListener("input", () => { autosize(); S.menuIndex = 0; showMenu(); });
  input.addEventListener("keydown", (e) => {
    if (!menu.hidden) {
      const list = matches();
      if (e.key === "ArrowDown") { e.preventDefault(); S.menuIndex = (S.menuIndex + 1) % list.length; return showMenu(); }
      if (e.key === "ArrowUp") { e.preventDefault(); S.menuIndex = (S.menuIndex - 1 + list.length) % list.length; return showMenu(); }
      // Enter on a command typed out in full SENDS it. It used to autocomplete
      // — "/status⏎" left "/status " sitting in the box, and the second Enter
      // nobody expected read as the slash commands not working (2026-09-30).
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing
          && input.value.trim().toLowerCase() === list[S.menuIndex].name.toLowerCase()) {
        e.preventDefault(); hideMenu(); return send();
      }
      if (e.key === "Tab" || (e.key === "Enter" && !e.shiftKey)) { e.preventDefault(); return pick(list[S.menuIndex]); }
      // Without this the document handler below sees the same Escape once the
      // menu is closed, and closing the menu would also stop the turn.
      if (e.key === "Escape") { e.stopPropagation(); return hideMenu(); }
    }
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  $("sc-send").onclick = send;
  $("sc-stop").onclick = stop;
  // Esc stops the turn, as it does in the terminal. In the message box it
  // closes the command menu first, so a menu Esc never interrupts a turn.
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || menu.hidden === false) return;
    e.preventDefault(); stop();
  });

  window.__scivoControl = S;  // for inspection
  start();
})();
</script>
