[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scivo-harness"
version = "0.1.0"
description = "A command-line harness for the Scivo research co-scientist"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.153",
    "mcp>=2.0",
]

[project.scripts]
scivo = "scivo_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scivo_harness"]

[tool.hatch.build.targets.wheel.force-include]
"src/scivo_harness/providers.example.toml" = "scivo_harness/providers.example.toml"
