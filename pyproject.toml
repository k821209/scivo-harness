[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scivo-harness"
version = "0.1.0"
description = "A command-line harness for the Scivo research co-scientist"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yang Jae Kang", email = "kangyangjae@plantprofile.net" }]
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.180",  # bundled CLI 2.1.321 knows claude-fable-5-2
    # Match co-scientist-local, which pins mcp<2. Our use is ClientSession /
    # stdio_client / call_tool / list_tools, unchanged across both.
    "mcp>=1.2",
    "prompt_toolkit>=3.0",
    # The Scivo MCP itself, so one install gets the whole harness. It is not on
    # PyPI, so this is a direct URL; that rules out publishing THIS package to
    # PyPI too, which is fine — it installs from git or a private index.
    "co-scientist-local @ git+https://github.com/k821209/co-scientist-mcp-public.git#subdirectory=apps/local-mcp",
]

[project.optional-dependencies]
# What the tests need. They were run for months from a venv somebody had
# installed pytest into by hand; a fresh clone had no way to know. Pillow is
# here because three image tests are skipped without it — and a suite that
# skips is a suite that has not run those.
dev = ["pytest>=8", "pytest-asyncio", "pytest-timeout", "pyflakes", "pillow"]

[project.scripts]
scivo = "scivo_harness.cli:main"

# Required for the git dependency above.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/scivo_harness"]

[tool.hatch.build.targets.wheel.force-include]
"src/scivo_harness/providers.example.toml" = "scivo_harness/providers.example.toml"
"src/scivo_harness/control_page.html" = "scivo_harness/control_page.html"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
